<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
        <style>
            #text {
                white-space: pre-wrap;
                font-family: "Segoe UI", sans-serif;
                line-height: 1.5;
                padding: 10px;
                border: 1px solid #ccc;
                margin-top: 10px;
                background: #f9f9f9;
            }
        </style>
    </head>
    <body>
        <input type="text" placeholder="Ask something..." id="question" onchange="handleQuestion()">
        <p id="text"></p>
        <script>
            const p = document.getElementById('text');
            let fullText = "";
            let previousMessage = '';

            function handleQuestion() {
                const question = document.getElementById('question').value;
                console.log(previousMessage);

                p.innerHTML = '';
                fetch("http://localhost:8080/qps/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt: question,
                        previousMessage: previousMessage
                    })
                })
                        .then(response => {
                            previousMessage = question;
                            const reader = response.body.getReader();
                            const decoder = new TextDecoder("utf-8");
                            let buffer = "";
                            return read(buffer, reader, decoder);
                        })
                        .catch(error => {
                            console.error("🚨 Error fetching stream:", error);
                            p.innerText = "❌ Failed to load data";
                        });
                p.innerText += '\n';
            }

            function read(buffer, reader, decoder) {
                return reader.read().then(({done, value}) => {
                    if (done) {
                        console.log("✅ Stream ended");
                        return;
                    }

                    buffer += decoder.decode(value, {stream: true});

                    const jsonRegex = /{[^}]*"response"\s*:\s*"[^"]*"[^}]*}/g;
                    let match;
                    let lastMatchEnd = 0;

                    while ((match = jsonRegex.exec(buffer)) !== null) {
                        const jsonStr = match[0];
                        try {
                            const obj = JSON.parse(jsonStr);
                            const responseText = obj.response;
                            if (responseText) {
                                p.innerText += responseText;
                            }
                        } catch (e) {
                            console.error("❌ JSON parse error:", e, jsonStr);
                        }
                        lastMatchEnd = jsonRegex.lastIndex;
                    }

                    buffer = buffer.slice(lastMatchEnd);
                    jsonRegex.lastIndex = 0;

                    return read(buffer, reader, decoder);
                });
            }

            fetch("http://localhost:8080/qps/ask", {
                method: "GET",
                headers: {
                    "Content-Type": "application/json"
                }
            })
                    .then(res => {
                        const reader = res.body.getReader();
                        const decoder = new TextDecoder("utf-8");
                        let buffer = "";
                        return read(buffer, reader, decoder);
                    })
                    .catch(err => {
                        console.error("⚠️ Error loading greeting:", err);
                        document.getElementById('text').innerText = "Hello! I'm Miss. Let's start learning!";
                    });
            p.innerText += '\n';
        </script>
    </body>
</html>
